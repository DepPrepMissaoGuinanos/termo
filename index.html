<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Termo de Responsabilidade</title>
<style>
  :root { --accent: #c4591c; --ink: #1f1a17; --muted: #6f655e; --line: #ddd3cb; --bg: #faf6f2; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  .eyebrow { color: var(--accent); font-weight: 600; margin: 0 0 4px; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 20px; }
  h2 { font-size: 17px; line-height: 1.35; margin: 0 0 14px; text-align: center; }
  .step { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .field { display: block; margin-bottom: 16px; }
  .field span, .label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  input[type=text], input[type=tel], input[type=email], input[type=date] {
    width: 100%; min-height: 48px; padding: 10px 12px; font: inherit; color: inherit;
    background: #fff; border: 1px solid var(--line); border-radius: 10px; -webkit-appearance: none; appearance: none;
  }
  input:focus-visible, button:focus-visible, canvas:focus-visible { outline: 3px solid rgba(196, 89, 28, .35); outline-offset: 1px; }
  #termo { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px 16px; margin-bottom: 20px; }
  #termo p { margin: 0 0 12px; text-align: justify; hyphens: auto; }
  #termo p:last-child { margin-bottom: 0; text-align: left; }
  .check { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
  .check input { width: 22px; height: 22px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
  .label { margin-top: 22px; }
  .sigwrap { background: #fff; border: 2px dashed var(--line); border-radius: 12px; }
  canvas { display: block; width: 100%; height: 180px; touch-action: none; cursor: crosshair; border-radius: 12px; }
  button { font: inherit; font-weight: 600; min-height: 50px; padding: 12px 18px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; width: 100%; }
  button.secondary { background: transparent; color: var(--accent); }
  button.link { width: auto; min-height: 0; padding: 8px 0; border: 0; background: none; color: var(--muted); font-weight: 500; text-decoration: underline; }
  button:disabled { opacity: .6; cursor: default; }
  .actions { display: flex; gap: 12px; margin-top: 8px; }
  .actions .secondary { flex: 0 0 38%; }
  #error { color: #b3261e; font-weight: 600; min-height: 1.5em; margin: 8px 0; }
  #step3 { text-align: center; padding-top: 32px; }
  #step3 h2 { font-size: 24px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow" id="missao"></p>
  <h1>Termo de Responsabilidade</h1>

  <section id="loading">
    <p id="loadMsg" role="status">A carregar o formulário…</p>
    <button type="button" class="secondary" id="retry" hidden>Tentar de novo</button>
  </section>

  <section id="step1" hidden>
    <p class="step">Passo 1 de 2 · Os teus dados</p>
    <form id="form">
      <div id="fields"></div>
      <button type="button" id="next">Continuar</button>
    </form>
  </section>

  <section id="step2" hidden>
    <p class="step">Passo 2 de 2 · Lê o termo e assina</p>
    <article id="termo"></article>

    <label class="check"><input type="checkbox" id="aceito"><span>Li e aceito o termo de responsabilidade acima.</span></label>
    <label class="check"><input type="checkbox" id="rgpd"><span id="rgpdText"></span></label>

    <p class="label" id="sigLabel">Assinatura (desenha com o dedo)</p>
    <div class="sigwrap"><canvas id="sig" aria-labelledby="sigLabel"></canvas></div>
    <button type="button" class="link" id="clear">Limpar assinatura</button>

    <p id="error" role="alert"></p>
    <div class="actions">
      <button type="button" class="secondary" id="back">Corrigir dados</button>
      <button type="button" id="submit">Assinar e submeter</button>
    </div>
  </section>

  <section id="step3" hidden>
    <h2>Obrigado!</h2>
    <p>O teu termo de responsabilidade foi assinado e entregue à <span id="assoc"></span>.</p>
    <p id="emailNote"></p>
  </section>
</main>

<script>
  // ====== COLA AQUI o URL da app Web do Apps Script (termina em /exec) ======
  const API_URL = 'https://script.google.com/macros/s/AKfycbz-x1Uisfig60KZ7sQ6H-_qZcFKmoH6EEPPvUkBaEi_J5s0ojhQqfF7meKyFUdNk7eUZQ/exec';
  // ==========================================================================

  let BOOT = null;
  const $ = function (id) { return document.getElementById(id); };

  function loadFail(msg) {
    $('loadMsg').textContent = msg;
    $('retry').hidden = false;
  }

  function load() {
    $('retry').hidden = true;
    $('loadMsg').textContent = 'A carregar o formulário…';
    if (API_URL.indexOf('https://script.google.com/') !== 0) {
      $('loadMsg').textContent = 'Falta configurar o URL da app Web no ficheiro index.html.';
      return;
    }
    fetch(API_URL)
      .then(function (r) { return r.json(); })
      .then(function (cfg) {
        if (!cfg.ok) return loadFail(cfg.error || 'Não foi possível carregar o formulário.');
        BOOT = cfg;
        build();
        show(1);
      })
      .catch(function () { loadFail('Não foi possível carregar o formulário. Verifica a ligação à internet e tenta de novo.'); });
  }

  function build() {
    document.title = 'Termo de Responsabilidade - ' + BOOT.missao;
    $('missao').textContent = BOOT.missao;
    $('rgpdText').textContent = BOOT.consentimento;
    $('assoc').textContent = BOOT.associacao;
    $('fields').textContent = '';

    // Build the questions from the FIELDS list in Code.gs
    BOOT.fields.forEach(function (f) {
      const wrap = document.createElement('label');
      wrap.className = 'field';
      const span = document.createElement('span');
      span.textContent = f.label;
      const input = document.createElement('input');
      input.type = f.type;
      input.name = f.key;
      input.required = true;
      input.maxLength = 300;
      if (f.value) input.value = f.value;
      if (f.hint) input.placeholder = f.hint;
      wrap.append(span, input);
      $('fields').append(wrap);
    });
  }

  function values() {
    const out = {};
    BOOT.fields.forEach(function (f) { out[f.key] = $('form').elements[f.key].value.trim(); });
    return out;
  }

  function ptDate(d) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
    return m ? m[3] + '/' + m[2] + '/' + m[1] : d;
  }

  // Show the termo with the volunteer's own data filled in
  function renderTermo() {
    const v = values();
    BOOT.fields.forEach(function (f) { if (f.type === 'date') v[f.key] = ptDate(v[f.key]); });
    const now = new Date();
    v.DATA = now.getDate() + '/' + (now.getMonth() + 1) + '/' + now.getFullYear();

    const box = $('termo');
    box.textContent = '';
    const h = document.createElement('h2');
    h.textContent = BOOT.termo.titulo;
    box.append(h);

    BOOT.termo.paragrafos.concat(['{{LOCAL}}, {{DATA}}']).forEach(function (text) {
      const p = document.createElement('p');
      text.split(/(\{\{[A-Z_]+\}\})/).forEach(function (part) {
        const m = /^\{\{([A-Z_]+)\}\}$/.exec(part);
        if (m && v[m[1]] !== undefined) {
          const s = document.createElement('strong');
          s.textContent = v[m[1]];
          p.append(s);
        } else {
          p.append(part);
        }
      });
      box.append(p);
    });
  }

  function show(n) {
    $('loading').hidden = true;
    ['step1', 'step2', 'step3'].forEach(function (id, i) { $(id).hidden = (i + 1 !== n); });
    window.scrollTo(0, 0);
    if (n === 2) sizeCanvas();
  }

  function err(msg) { $('error').textContent = msg; }

  // ----- Signature pad -----
  const canvas = $('sig');
  const ctx = canvas.getContext('2d');
  let drawing = false, signed = false, lastW = 0;

  function sizeCanvas() {
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#111';
    signed = false;
    lastW = r.width;
  }

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    drawing = true;
    signed = true;
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(p[0], p[1]);
    ctx.lineTo(p[0] + 0.1, p[1] + 0.1);
    ctx.stroke();
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drawing) return;
    const p = pos(e);
    ctx.lineTo(p[0], p[1]);
    ctx.stroke();
  });
  ['pointerup', 'pointercancel'].forEach(function (t) {
    canvas.addEventListener(t, function () { drawing = false; });
  });
  window.addEventListener('resize', function () {
    if (!$('step2').hidden && Math.abs(canvas.getBoundingClientRect().width - lastW) > 1) sizeCanvas();
  });

  // ----- Buttons -----
  $('next').addEventListener('click', function () {
    if (!$('form').reportValidity()) return;
    renderTermo();
    err('');
    show(2);
  });
  $('back').addEventListener('click', function () { show(1); });
  $('clear').addEventListener('click', sizeCanvas);

  $('submit').addEventListener('click', function () {
    err('');
    if (!$('aceito').checked || !$('rgpd').checked) return err('Tens de aceitar as duas declarações para continuar.');
    if (!signed) return err('Falta a tua assinatura.');

    const payload = values();
    payload.aceito = true;
    payload.rgpd = true;
    payload.assinatura = canvas.toDataURL('image/png');

    const btn = $('submit');
    btn.disabled = true;
    $('back').disabled = true;
    btn.textContent = 'A enviar…';

    function fail(msg) {
      btn.disabled = false;
      $('back').disabled = false;
      btn.textContent = 'Assinar e submeter';
      err(msg || 'Não foi possível enviar. Verifica a ligação à internet e tenta novamente.');
    }

    // text/plain keeps this a "simple" request, which Apps Script accepts from other sites.
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) return fail(res.error);
        $('emailNote').textContent = BOOT.enviarEmail ? 'Vais receber uma cópia do termo em ' + payload.EMAIL + '.' : '';
        show(3);
      })
      .catch(function () { fail(); });
  });

  $('retry').addEventListener('click', load);
  load();
</script>
</body>
</html>
